name: Gelbooru a Discord

on:
  schedule:
    # Cada 5 minutos (es el intervalo mínimo que permite GitHub Actions).
    - cron: "*/5 * * * *"
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

# Evita que dos ejecuciones se pisen si una se retrasa.
concurrency:
  group: gelbooru-discord
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # El historial de posts ya enviados (state/posted.json) se conserva entre
      # ejecuciones con la caché de Actions: cada ejecución restaura la más reciente
      # y guarda una nueva.
      - name: Restaurar historial de posts enviados
        uses: actions/cache/restore@v4
        with:
          path: state
          key: posted-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            posted-

      - name: Publicar en Discord
        env:
          # Un secret por canal. Cada nombre debe coincidir con el "webhook_env"
          # del canal en channels.json. Para más de 5 canales, añade más líneas.
          DISCORD_WEBHOOK_1: ${{ secrets.DISCORD_WEBHOOK_1 }}
          DISCORD_WEBHOOK_2: ${{ secrets.DISCORD_WEBHOOK_2 }}
          DISCORD_WEBHOOK_3: ${{ secrets.DISCORD_WEBHOOK_3 }}
          DISCORD_WEBHOOK_4: ${{ secrets.DISCORD_WEBHOOK_4 }}
          DISCORD_WEBHOOK_5: ${{ secrets.DISCORD_WEBHOOK_5 }}
          # Cuenta de Gelbooru (opcional).
          GELBOORU_LOGIN: ${{ secrets.GELBOORU_LOGIN }}
          GELBOORU_API_KEY: ${{ secrets.GELBOORU_API_KEY }}
        run: python gelbooru_webhook.py

      - name: Guardar historial de posts enviados
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: posted-${{ github.run_id }}-${{ github.run_attempt }}
